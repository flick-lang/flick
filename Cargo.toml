[package]
name = "flick"
version = "0.1.0"
authors = ["Max Larsson <maxslarsson@gmail.com>", "Thomas Breydo <tbreydo@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/flick-lang/flick"
homepage = "https://github.com/flick-lang/flick"
description = "The Flick Programming Language"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
opt-level = 3
lto = true
debug = "line-tables-only"
codegen-units = 1

[dependencies]
llvm-sys = "231"
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.8", features = ["derive"], optional = true }
tempfile = { version = "3.27.0", optional = true }

[features]
default = ["binary"]
binary = ["anyhow", "clap", "tempfile"]
